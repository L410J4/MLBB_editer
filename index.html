ader><div class="toolbar"><button id="move" class="active">移動・選択</button><button id="connect">線をつなぐ</button><button id="addHero">＋ヒーロー</button><button id="addNpc">＋NPC</button><button id="addOrg">＋組織</button><button id="addRegion">＋地域</button><button id="undo" disabled>元に戻す</button><button id="redo" disabled>やり直す</button><button id="circle" hidden>正円にする</button><button id="del">選択を削除</button></div><div class="zoomtools"><button id="zoomOut">－</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button><button id="zoomFit">全体表示</button><span class="hint">余白ドラッグで移動・2本指／ホイールでズーム</span></div><label style="display:block;padding:10px"><input type="checkbox" id="follow"> 地域の移動に内部の人物を追従させる（初期OFF）</label><div class="board"><svg id="canvas" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg"><g id="drawing"></g></svg></div><div class="panel"><div class="hint" id="status">丸や四角をタップして選択。ドラッグで移動。線をタップして関係を編集。</div><label><span id="nameCaption">名前・関係名</span> <input id="name" placeholder="対象を選択" /></label><label id="directionRow" hidden>関係線の方向 <select id="direction"><option value="none">方向なし A ─ B</option><option value="forward">一方向 A → B</option><option value="both">双方向 A ⇄ B</option></select></label><div id="endpoints" class="hint" hidden></div><label id="reverseRow" hidden>B → A の関係名 <input id="reverseName" /></label><label>分類 <select id="kind"><option value="hero">ヒーロー</option><option value="npc">NPC</option><option value="org">組織・地名</option><option value="region">地域の囲み</option></select></label><div class="toolbar"><button id="save">JSON保存</button><button id="load">JSON読込</button><button id="png">PNG出力</button><button id="reset">サンプルに戻す</button><input type="file" id="file" accept=".json,application/json" hidden></div><div class="hint">※サンプルの人物・線は操作確認用。公式の関係を意味しません。JSONはiPhoneの「ファイル」に保存してバックアップしてください。</div></div><footer>データはこの画面内で編集します。自動的なクラウド保存・Excel同期はありません。</footer><script>

function sample(){return {version:1,nodes:[{id:'r1',kind:'region',name:'地域A（例）',x:40,y:60,w:380,h:440},{id:'r2',kind:'region',name:'地域B（例）',x:480,y:60,w:380,h:440},{id:'h1',kind:'hero',name:'ヒーローA',x:210,y:220},{id:'h2',kind:'hero',name:'ヒーローB',x:650,y:220},{id:'n1',kind:'npc',name:'NPC A',x:210,y:370}],edges:[{id:'e1',a:'h1',b:'h2',name:'関係（例）'}]}}

function size(n){return {w:n.w||(n.kind==='region'?320:n.kind==='org'?138:104),h:n.h||(n.kind==='region'?300:n.kind==='org'?54:104)}}

function sync(){const item=node(selected)||data.edges.find(e=>e.id===selected),input=document.getElementById('name');if(document.activeElement!==input)input.value=item?.name||'';input.disabled=!item;const edge=data.edges.find(e=>e.id===selected),dir=edge?direction(edge):document.getElementById('direction').value||'none';document.getElementById('circle').hidden=!['hero','npc'].includes(item?.kind);document.getElementById('directionRow').hidden=!edge&&mode!=='connect';if(edge)document.getElementById('direction').value=dir;document.getElementById('reverseRow').hidden=!edge||dir!=='both';const reverseInput=document.getElementById('reverseName');if(document.activeElement!==reverseInput)reverseInput.value=edge?.reverseName??'';document.getElementById('nameCaption').textContent=edge?(dir==='none'?'共通の関係名':'A → B の関係名'):'名前・関係名';document.getElementById('endpoints').hidden=!edge;if(edge)document.getElementById('endpoints').textContent=`A：${node(edge.a)?.name??edge.a} ／ B：${node(edge.b)?.name??edge.b}`;document.getElementById('kind').disabled=!item||!('kind' in item);if(item?.kind)document.getElementById('kind').value=item.kind;document.getElementById('status').textContent=mode==='connect'?(from?'接続先をタップ':'線の始点をタップ'):item?`選択中：${item.name}（四隅でサイズ変更）`:'図形や線をタップして選択できます';historyButtons()}

if(g.type==='move'){n.x=Math.round(g.x+dx);n.y=Math.round(g.y+dy);for(const f of g.followers){const v=node(f.id);v.x=f.x+n.x-g.x;v.y=f.y+n.y-g.y}}
else {const b=g.b,west=g.corner.includes('w'),north=g.corner.includes('n');const w=Math.max(44,b.w+(west?-dx:dx)),h=Math.max(44,b.h+(north?-dy:dy)),x=west?b.x+b.w-w:b.x,y=north?b.y+b.h-h:b.y;n.w=Math.round(w);n.h=Math.round(h);n.x=n.kind==='region'?x:x+w/2;n.y=n.kind==='region'?y:y+h/2}draw()});
function stop(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(multi){if(pointers.size>=2)beginPinch();else pinch=null;if(!pointers.size)multi=false}else if(gesture&&e.pointerId===gesture.pointer){const g=gesture;gesture=null;const cancelled=e.type==='pointercancel'||e.type==='lostpointercapture';if(cancelled&&g.before)data=JSON.parse(g.before);else if(g.type==='connect'&&!cancelled){const id=g.id;if(!from){from=id;selected=id}else if(from!==id){change(()=>{data.edges.push({id:uid(),a:from,b:id,name:'関係未入力',direction:document.getElementById('direction').value||'none',reverseName:''});from=null;selected=data.edges.at(-1).id;mode='move';setModeButtons()})}}else if(g.before)record(g.before)}if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);draw()}
svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('lostpointercapture',stop);
svg.addEventListener('wheel',e=>{e.preventDefault();const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?svg.clientHeight:1);zoom(Math.exp(-Math.max(-500,Math.min(500,delta))*.002),e)},{passive:false});
// Restrict native Safari gestures to the editor; page controls remain accessible.
for(const type of ['touchstart','touchmove','gesturestart','gesturechange'])svg.addEventListener(type,e=>e.preventDefault(),{passive:false});
function setModeButtons(){for(const m of ['move','connect'])document.getElementById(m).classList.toggle('active',mode===m)}for(const m of ['move','connect'])document.getElementById(m).onclick=()=>{mode=m;from=null;setModeButtons();draw()};
function add(kind){change(()=>{const n={id:uid(),kind,name:kind==='hero'?'新規ヒーロー':kind==='npc'?'新規NPC':kind==='org'?'新規組織・地名':'新規地域',x:view.x+view.w/2,y:view.y+view.h/2};if(kind==='region'){n.x-=200;n.y-=180;n.w=400;n.h=360}data.nodes.push(n);selected=n.id})}
for(const [id,k] of [['addHero','hero'],['addNpc','npc'],['addOrg','org'],['addRegion','region']])document.getElementById(id).onclick=()=>add(k);
document.getElementById('del').onclick=()=>{if(!selected)return;change(()=>{data.nodes=data.nodes.filter(n=>n.id!==selected);data.edges=data.edges.filter(e=>e.id!==selected&&e.a!==selected&&e.b!==selected);selected=null;from=null})};
document.getElementById('name').oninput=e=>{const item=node(selected)||data.edges.find(e=>e.id===selected);if(item){if(editBefore===null)editBefore=snapshot();item.name=e.target.value;draw()}};
document.getElementById('name').onblur=finishEdit;
document.getElementById('circle').onclick=()=>{const n=node(selected);if(!n||!['hero','npc'].includes(n.kind))return;change(()=>{const {w,h}=size(n);n.w=n.h=Math.max(w,h)})};
document.getElementById('direction').onchange=e=>{const edge=data.edges.find(v=>v.id===selected);if(edge)change(()=>{edge.direction=e.target.value});else sync()};
document.getElementById('reverseName').oninput=e=>{const edge=data.edges.find(v=>v.id===selected);if(edge&&direction(edge)==='both'){if(editBefore===null)editBefore=snapshot();edge.reverseName=e.target.value;draw()}};
document.getElementById('reverseName').onblur=finishEdit;
document.getElementById('kind').onchange=e=>change(()=>{const n=node(selected);if(n){const b=bounds(n);n.kind=e.target.value;n.w=b.w;n.h=b.h;n.x=n.kind==='region'?b.x:b.x+b.w/2;n.y=n.kind==='region'?b.y:b.y+b.h/2}});
function normalize(d){if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('nodes / edges が必要です');const ids=new Set();for(const n of d.nodes){if(!n||typeof n.id!=='string'||ids.has(n.id)||!['hero','npc','org','region'].includes(n.kind)||!Number.isFinite(n.x)||!Number.isFinite(n.y))throw Error('図形データが不正です');ids.add(n.id);for(const key of ['w','h'])if(n[key]!==undefined&&(!Number.isFinite(n[key])||n[key]<=0))throw Error('図形サイズが不正です');n.name=String(n.name??'')}for(const e of d.edges){if(!e||typeof e.id!=='string'||ids.has(e.id)||typeof e.a!=='string'||typeof e.b!=='string')throw Error('関係線データが不正です');if(e.direction!==undefined&&!['none','forward','both'].includes(e.direction))throw Error('関係線の方向が不正です');if(e.reverseName!==undefined&&typeof e.reverseName!=='string')throw Error('逆方向の関係名が不正です');ids.add(e.id);e.name=String(e.name??'')}return d}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}document.getElementById('save').onclick=()=>download(new Blob([JSON.stringify({...data,version:3,nodes:data.nodes.map(n=>({...n,...size(n)}))},null,2)],{type:'application/json'}),'MLBB_相関図編集データ.json');document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('形式が違います');change(()=>{data=normalize(d);selected=null;from=null})}catch(err){alert('読み込み失敗: '+err.message)}e.target.value=''};document.getElementById('reset').onclick=()=>{if(confirm('現在の編集内容を破棄してサンプルに戻しますか？')){change(()=>{data=sample();selected=null;from=null})}};document.getElementById('png').onclick=()=>{finishEdit();const copy=svg.cloneNode(true);copy.querySelector('[data-controls]')?.remove();copy.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=document.querySelector('style').textContent;copy.prepend(style);copy.setAttribute('width','1800');copy.setAttribute('height','1300');copy.setAttribute('xmlns','http://www.w3.org/2000/svg');const str=new XMLSerializer().serializeToString(copy);const img=new Image(),url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=1800;c.height=1300;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'MLBB_相関図.png')},'image/png');URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);alert('PNG変換に失敗しました')};img.src=url};data=sample();setView();draw();
</script></body></html>
