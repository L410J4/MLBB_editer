<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MLBB 人物相関図エディター v0.4</title><style>body{margin:0;font:14px system-ui;background:#f4f6fa;color:#182033}header{padding:12px;background:#1d2942;color:white}header b{font-size:17px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:9px;background:white}button,select,input{font:inherit;border:1px solid #b7c1d3;border-radius:7px;padding:9px;background:white;color:#182033}button.active{background:#244f9e;color:white}.board{height:60vh;overflow:hidden;background:#fff;touch-action:none;border-block:1px solid #cbd2df}svg{width:100%;height:100%;touch-action:none}.panel{padding:10px;display:grid;gap:7px}.panel label{display:flex;align-items:center;gap:8px}.panel input{flex:1;min-width:0}.hint{font-size:12px;color:#667085}.edge-hit{stroke:transparent;stroke-width:22;cursor:pointer}.node{cursor:grab}.selected{filter:drop-shadow(0 0 4px #316cff)}.region{fill:#f7f8fc;stroke:#67758f;stroke-width:2;stroke-dasharray:8 5}.rel{fill:#222;font-size:15px;font-weight:600;pointer-events:none}.rel-bg{fill:white;stroke:#b8c0cd;stroke-width:1;cursor:pointer}.zoomtools{display:flex;gap:6px;align-items:center;padding:8px;background:#edf2f9}.zoomtools button{min-width:45px;font-size:18px}.zoomtools span{font-weight:600;min-width:58px;text-align:center}.small{font-size:12px}footer{padding:12px;color:#667085}.node text{pointer-events:none}.handle{fill:#fff;stroke:#2463cc;stroke-width:1.5;pointer-events:none;vector-effect:non-scaling-stroke}.handle-hit{fill:transparent;pointer-events:all;cursor:nwse-resize}.board{overscroll-behavior:contain}.board{user-select:none;-webkit-user-select:none}button,input,select{min-height:44px;box-sizing:border-box}input,select{font-size:16px}.rel{paint-order:stroke;stroke:white;stroke-width:3px}</style></head><body><header><b>MLBB 人物相関図エディター</b> <span class="small">v0.4 / 添削用</span></header><div class="toolbar"><button id="move" class="active">移動・選択</button><button id="connect">線をつなぐ</button><button id="addHero">＋ヒーロー</button><button id="addNpc">＋NPC</button><button id="addOrg">＋組織</button><button id="addRegion">＋地域</button><button id="undo" disabled>元に戻す</button><button id="redo" disabled>やり直す</button><button id="del">選択を削除</button></div><div class="zoomtools"><button id="zoomOut">－</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button><button id="zoomFit">全体表示</button><span class="hint">余白ドラッグで移動・2本指／ホイールでズーム</span></div><label style="display:block;padding:10px"><input type="checkbox" id="follow"> 地域の移動に内部の人物を追従させる（初期OFF）</label><div class="board"><svg id="canvas" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg"><g id="drawing"></g></svg></div><div class="panel"><div class="hint" id="status">丸や四角をタップして選択。ドラッグで移動。線をタップして関係を編集。</div><label>名前・関係名 <input id="name" placeholder="対象を選択" /></label><label>分類 <select id="kind"><option value="hero">ヒーロー</option><option value="npc">NPC</option><option value="org">組織・地名</option><option value="region">地域の囲み</option></select></label><div class="toolbar"><button id="save">JSON保存</button><button id="load">JSON読込</button><button id="png">PNG出力</button><button id="reset">サンプルに戻す</button><input type="file" id="file" accept=".json,application/json" hidden></div><div class="hint">※サンプルの人物・線は操作確認用。公式の関係を意味しません。JSONはiPhoneの「ファイル」に保存してバックアップしてください。</div></div><footer>データはこの画面内で編集します。自動的なクラウド保存・Excel同期はありません。</footer><script>
const svg=document.getElementById('canvas'),drawing=document.getElementById('drawing');let mode='move',selected=null,from=null;let data;let view={x:0,y:0,w:900,h:650};function setView(){svg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '));document.getElementById('zoomValue').textContent=Math.round(900/view.w*100)+'%'}const MIN_WIDTH=150,MAX_WIDTH=2700;
function zoom(f,client){if(pointers.size||gesture)return;const old={...view},anchor=client?point(client):{x:view.x+view.w/2,y:view.y+view.h/2};const w=Math.max(MIN_WIDTH,Math.min(MAX_WIDTH,view.w/f)),ratio=w/old.w;view={x:anchor.x-(anchor.x-old.x)*ratio,y:anchor.y-(anchor.y-old.y)*ratio,w,h:w*650/900};setView();draw()}
document.getElementById('zoomIn').onclick=()=>zoom(1.35);document.getElementById('zoomOut').onclick=()=>zoom(1/1.35);document.getElementById('zoomFit').onclick=()=>{if(pointers.size||gesture)return;view={x:0,y:0,w:900,h:650};setView();draw()};
function sample(){return {version:1,nodes:[{id:'r1',kind:'region',name:'地域A（例）',x:40,y:60,w:380,h:440},{id:'r2',kind:'region',name:'地域B（例）',x:480,y:60,w:380,h:440},{id:'h1',kind:'hero',name:'ヒーローA',x:210,y:220},{id:'h2',kind:'hero',name:'ヒーローB',x:650,y:220},{id:'n1',kind:'npc',name:'NPC A',x:210,y:370}],edges:[{id:'e1',a:'h1',b:'h2',name:'関係（例）'}]}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function node(id){return data.nodes.find(n=>n.id===id)}
// Old files keep their original coordinates: region = top left, other nodes = centre.
const undoStack=[],redoStack=[];let gesture=null,editBefore=null;const pointers=new Map();let multi=false,pinch=null;
const snapshot=()=>JSON.stringify(data);
function record(before){if(before===snapshot())return;undoStack.push(before);if(undoStack.length>100)undoStack.shift();redoStack.length=0;historyButtons()}
function historyButtons(){document.getElementById('undo').disabled=!undoStack.length;document.getElementById('redo').disabled=!redoStack.length}
function finishEdit(){if(editBefore!==null){record(editBefore);editBefore=null}}
function change(fn){finishEdit();const before=snapshot();fn();record(before);draw()}
function restore(src,dst){finishEdit();if(!src.length)return;dst.push(snapshot());data=JSON.parse(src.pop());selected=null;from=null;draw();historyButtons()}
document.getElementById('undo').onclick=()=>restore(undoStack,redoStack);
document.getElementById('redo').onclick=()=>restore(redoStack,undoStack);
function size(n){return {w:n.w||(n.kind==='region'?320:n.kind==='org'?138:104),h:n.h||(n.kind==='region'?300:n.kind==='org'?54:104)}}
function bounds(n){const {w,h}=size(n);return {x:n.kind==='region'?n.x:n.x-w/2,y:n.kind==='region'?n.y:n.y-h/2,w,h}}
function center(n){const b=bounds(n);return {x:b.x+b.w/2,y:b.y+b.h/2}}
function anchor(n,t){const c=center(n),{w,h}=size(n),dx=t.x-c.x,dy=t.y-c.y;if(!dx&&!dy)return c;const k=n.kind==='hero'||n.kind==='npc'?1/Math.sqrt((dx/(w/2))**2+(dy/(h/2))**2):1/Math.max(Math.abs(dx)/(w/2),Math.abs(dy)/(h/2));return {x:c.x+dx*k,y:c.y+dy*k}}
function draw(){let html='';
for(const n of [...data.nodes.filter(n=>n.kind==='region'),...data.nodes.filter(n=>n.kind!=='region')]){const b=bounds(n),c=center(n),id=esc(n.id);html+=`<g data-node="${id}" class="node ${selected===n.id?'selected':''}">`;
if(n.kind==='region')html+=`<rect class="region" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="14"/><text x="${b.x+14}" y="${b.y+27}" font-weight="bold">${esc(n.name)}</text>`;
else {html+=n.kind==='org'?`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" fill="#f0f2f7" stroke="#222" stroke-width="2"/>`:`<ellipse cx="${c.x}" cy="${c.y}" rx="${b.w/2}" ry="${b.h/2}" fill="${n.kind==='npc'?'#fff':'#e1eafa'}" stroke="#222" stroke-width="2.5" ${n.kind==='npc'?'stroke-dasharray="6 5"':''}/>`;html+=`<text x="${c.x}" y="${c.y+5}" text-anchor="middle" font-size="15">${esc(n.name)}</text>`}html+='</g>'}
// Draw lines and labels above shapes, ending at shape boundaries.
for(const e of data.edges){const na=node(e.a),nb=node(e.b);if(!na||!nb)continue;const a=anchor(na,center(nb)),b=anchor(nb,center(na)),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,tw=Math.max(54,String(e.name).length*16+18);html+=`<g data-edge="${esc(e.id)}" class="${selected===e.id?'selected':''}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="white" stroke-width="5" pointer-events="none"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#252c38" stroke-width="2" pointer-events="none"/><line class="edge-hit" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><rect class="rel-bg" x="${mx-tw/2}" y="${my-30}" width="${tw}" height="25" rx="5"/><text class="rel" x="${mx}" y="${my-12}" text-anchor="middle">${esc(e.name)}</text></g>`}
const n=node(selected);if(n&&mode==='move'){const b=bounds(n),ctm=svg.getScreenCTM(),scale=ctm?Math.hypot(ctm.a,ctm.b):1,minSide=Math.min(b.w,b.h)*scale;html+=`<g data-controls="true"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="none" stroke="#2463cc" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
// Hide handles when 44px hit areas would overlap; retain the selection outline.
if(minSide>=56){const r=Math.min(5, minSide*.08)/scale,hit=22/scale;for(const [corner,x,y] of [['nw',b.x,b.y],['ne',b.x+b.w,b.y],['sw',b.x,b.y+b.h],['se',b.x+b.w,b.y+b.h]])html+=`<rect data-handle="${corner}" class="handle-hit" x="${x-hit}" y="${y-hit}" width="${hit*2}" height="${hit*2}"/><rect class="handle" x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" rx="2"/>`}html+='</g>'}
drawing.innerHTML=html;sync()}
function sync(){const item=node(selected)||data.edges.find(e=>e.id===selected),input=document.getElementById('name');if(document.activeElement!==input)input.value=item?.name||'';input.disabled=!item;document.getElementById('kind').disabled=!item||!('kind' in item);if(item?.kind)document.getElementById('kind').value=item.kind;document.getElementById('status').textContent=mode==='connect'?(from?'接続先をタップ':'線の始点をタップ'):item?`選択中：${item.name}（四隅でサイズ変更）`:'図形や線をタップして選択できます';historyButtons()}
function point(evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function matrixPoint(x,y,m){return {x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}}
function pair(){const [a,b]=[...pointers.values()];return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2,d:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY))}}
function beginPinch(){const g=gesture;gesture=null;if(g?.before)data=JSON.parse(g.before);multi=true;const p=pair(),matrix=svg.getScreenCTM().inverse();pinch={...p,view:{...view},matrix,anchor:matrixPoint(p.x,p.y,matrix)};draw()}
svg.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});svg.setPointerCapture(e.pointerId);if(pointers.size>=2){beginPinch();return}if(multi||gesture)return;finishEdit();const p=point(e),handle=e.target.closest('[data-handle]'),target=e.target.closest('[data-node],[data-edge]');
if(handle&&node(selected)){gesture={type:'resize',id:selected,corner:handle.dataset.handle,b:bounds(node(selected)),p,before:snapshot(),pointer:e.pointerId}}
else if(!target){if(mode!=='move')return;selected=null;gesture={type:'pan',clientX:e.clientX,clientY:e.clientY,view:{...view},matrix:svg.getScreenCTM().inverse(),pointer:e.pointerId};draw()}
else {const id=target.dataset.node||target.dataset.edge;
if(mode==='connect'&&target.dataset.node){gesture={type:'connect',id,pointer:e.pointerId};return}
selected=id;if(target.dataset.node&&mode==='move'){const n=node(id),b=bounds(n);const followers=n.kind==='region'&&document.getElementById('follow').checked?data.nodes.filter(v=>['hero','npc'].includes(v.kind)&&v.x>=b.x&&v.x<=b.x+b.w&&v.y>=b.y&&v.y<=b.y+b.h):[];gesture={type:'move',id,p,x:n.x,y:n.y,followers:followers.map(v=>({id:v.id,x:v.x,y:v.y})),before:snapshot(),pointer:e.pointerId}}draw()}
if(gesture){e.preventDefault();svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});e.preventDefault();if(multi){if(pointers.size>=2&&pinch){const p=pair(),v=pinch.view,w=Math.max(MIN_WIDTH,Math.min(MAX_WIDTH,v.w*pinch.d/p.d)),ratio=w/v.w,current=matrixPoint(p.x,p.y,pinch.matrix);view={x:pinch.anchor.x-(current.x-v.x)*ratio,y:pinch.anchor.y-(current.y-v.y)*ratio,w,h:w*650/900};setView();draw()}return}const g=gesture;if(!g||e.pointerId!==g.pointer||g.type==='connect')return;if(g.type==='pan'){const dx=e.clientX-g.clientX,dy=e.clientY-g.clientY;view.x=g.view.x-(g.matrix.a*dx+g.matrix.c*dy);view.y=g.view.y-(g.matrix.b*dx+g.matrix.d*dy);setView();return}
const p=point(e),n=node(g.id);if(!n)return;const dx=p.x-g.p.x,dy=p.y-g.p.y;
if(g.type==='move'){n.x=Math.round(g.x+dx);n.y=Math.round(g.y+dy);for(const f of g.followers){const v=node(f.id);v.x=f.x+n.x-g.x;v.y=f.y+n.y-g.y}}
else {const b=g.b,west=g.corner.includes('w'),north=g.corner.includes('n');const w=Math.max(44,b.w+(west?-dx:dx)),h=Math.max(44,b.h+(north?-dy:dy)),x=west?b.x+b.w-w:b.x,y=north?b.y+b.h-h:b.y;n.w=Math.round(w);n.h=Math.round(h);n.x=n.kind==='region'?x:x+w/2;n.y=n.kind==='region'?y:y+h/2}draw()});
function stop(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(multi){if(pointers.size>=2)beginPinch();else pinch=null;if(!pointers.size)multi=false}else if(gesture&&e.pointerId===gesture.pointer){const g=gesture;gesture=null;const cancelled=e.type==='pointercancel'||e.type==='lostpointercapture';if(cancelled&&g.before)data=JSON.parse(g.before);else if(g.type==='connect'&&!cancelled){const id=g.id;if(!from){from=id;selected=id}else if(from!==id){change(()=>{data.edges.push({id:uid(),a:from,b:id,name:'関係未入力'});from=null;selected=data.edges.at(-1).id;mode='move';setModeButtons()})}}else if(g.before)record(g.before)}if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);draw()}
svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('lostpointercapture',stop);
svg.addEventListener('wheel',e=>{e.preventDefault();const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?svg.clientHeight:1);zoom(Math.exp(-Math.max(-500,Math.min(500,delta))*.002),e)},{passive:false});
// Restrict native Safari gestures to the editor; page controls remain accessible.
for(const type of ['touchstart','touchmove','gesturestart','gesturechange'])svg.addEventListener(type,e=>e.preventDefault(),{passive:false});
function setModeButtons(){for(const m of ['move','connect'])document.getElementById(m).classList.toggle('active',mode===m)}for(const m of ['move','connect'])document.getElementById(m).onclick=()=>{mode=m;from=null;setModeButtons();draw()};
function add(kind){change(()=>{const n={id:uid(),kind,name:kind==='hero'?'新規ヒーロー':kind==='npc'?'新規NPC':kind==='org'?'新規組織・地名':'新規地域',x:view.x+view.w/2,y:view.y+view.h/2};if(kind==='region'){n.x-=200;n.y-=180;n.w=400;n.h=360}data.nodes.push(n);selected=n.id})}
for(const [id,k] of [['addHero','hero'],['addNpc','npc'],['addOrg','org'],['addRegion','region']])document.getElementById(id).onclick=()=>add(k);
document.getElementById('del').onclick=()=>{if(!selected)return;change(()=>{data.nodes=data.nodes.filter(n=>n.id!==selected);data.edges=data.edges.filter(e=>e.id!==selected&&e.a!==selected&&e.b!==selected);selected=null;from=null})};
document.getElementById('name').oninput=e=>{const item=node(selected)||data.edges.find(e=>e.id===selected);if(item){if(editBefore===null)editBefore=snapshot();item.name=e.target.value;draw()}};
document.getElementById('name').onblur=finishEdit;
document.getElementById('kind').onchange=e=>change(()=>{const n=node(selected);if(n){const b=bounds(n);n.kind=e.target.value;n.w=b.w;n.h=b.h;n.x=n.kind==='region'?b.x:b.x+b.w/2;n.y=n.kind==='region'?b.y:b.y+b.h/2}});
function normalize(d){if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('nodes / edges が必要です');const ids=new Set();for(const n of d.nodes){if(!n||typeof n.id!=='string'||ids.has(n.id)||!['hero','npc','org','region'].includes(n.kind)||!Number.isFinite(n.x)||!Number.isFinite(n.y))throw Error('図形データが不正です');ids.add(n.id);for(const key of ['w','h'])if(n[key]!==undefined&&(!Number.isFinite(n[key])||n[key]<=0))throw Error('図形サイズが不正です');n.name=String(n.name??'')}for(const e of d.edges){if(!e||typeof e.id!=='string'||ids.has(e.id)||typeof e.a!=='string'||typeof e.b!=='string')throw Error('関係線データが不正です');ids.add(e.id);e.name=String(e.name??'')}return d}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}document.getElementById('save').onclick=()=>download(new Blob([JSON.stringify({...data,version:3,nodes:data.nodes.map(n=>({...n,...size(n)}))},null,2)],{type:'application/json'}),'MLBB_相関図編集データ.json');document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('形式が違います');change(()=>{data=normalize(d);selected=null;from=null})}catch(err){alert('読み込み失敗: '+err.message)}e.target.value=''};document.getElementById('reset').onclick=()=>{if(confirm('現在の編集内容を破棄してサンプルに戻しますか？')){change(()=>{data=sample();selected=null;from=null})}};document.getElementById('png').onclick=()=>{finishEdit();const copy=svg.cloneNode(true);copy.querySelector('[data-controls]')?.remove();copy.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=document.querySelector('style').textContent;copy.prepend(style);copy.setAttribute('width','1800');copy.setAttribute('height','1300');copy.setAttribute('xmlns','http://www.w3.org/2000/svg');const str=new XMLSerializer().serializeToString(copy);const img=new Image(),url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=1800;c.height=1300;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'MLBB_相関図.png')},'image/png');URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);alert('PNG変換に失敗しました')};img.src=url};data=sample();setView();draw();
</script></body></html>
