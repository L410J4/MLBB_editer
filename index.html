<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MLBB 人物相関図エディター v0.1</title><style>body{margin:0;font:14px system-ui;background:#f4f6fa;color:#182033}header{padding:12px;background:#1d2942;color:white}header b{font-size:17px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:9px;background:white}button,select,input{font:inherit;border:1px solid #b7c1d3;border-radius:7px;padding:9px;background:white;color:#182033}button.active{background:#244f9e;color:white}.board{height:54vh;overflow:hidden;background:#fff;touch-action:none;border-block:1px solid #cbd2df}svg{width:100%;height:100%;touch-action:none}.panel{padding:10px;display:grid;gap:7px}.panel label{display:flex;align-items:center;gap:8px}.panel input{flex:1;min-width:0}.hint{font-size:12px;color:#667085}.edge-hit{stroke:transparent;stroke-width:22;cursor:pointer}.node{cursor:grab}.selected{filter:drop-shadow(0 0 4px #316cff)}.region{fill:#f7f8fc;stroke:#67758f;stroke-width:2;stroke-dasharray:8 5}.rel{paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round;fill:#222;font-size:13px}.small{font-size:12px}footer{padding:12px;color:#667085}</style></head><body><header><b>MLBB 人物相関図エディター</b> <span class="small">v0.1 / 添削用</span></header><div class="toolbar"><button id="move" class="active">移動・選択</button><button id="connect">線をつなぐ</button><button id="addHero">＋ヒーロー</button><button id="addNpc">＋NPC</button><button id="addOrg">＋組織</button><button id="addRegion">＋地域</button><button id="del">選択を削除</button></div><div class="board"><svg id="canvas" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg"><g id="drawing"></g></svg></div><div class="panel"><div class="hint" id="status">丸や四角をタップして選択。ドラッグで移動。線をタップして関係を編集。</div><label>名前・関係名 <input id="name" placeholder="対象を選択" /></label><label>分類 <select id="kind"><option value="hero">ヒーロー</option><option value="npc">NPC</option><option value="org">組織・地名</option><option value="region">地域の囲み</option></select></label><div class="toolbar"><button id="save">JSON保存</button><button id="load">JSON読込</button><button id="png">PNG出力</button><button id="reset">サンプルに戻す</button><input type="file" id="file" accept=".json,application/json" hidden></div><div class="hint">※サンプルの人物・線は操作確認用。公式の関係を意味しません。JSONはiPhoneの「ファイル」に保存してバックアップしてください。</div></div><footer>データはこの画面内で編集します。自動的なクラウド保存・Excel同期はありません。</footer><script>
const svg=document.getElementById('canvas'),drawing=document.getElementById('drawing');let mode='move',selected=null,from=null,drag=null;let data;
function sample(){return {version:1,nodes:[{id:'r1',kind:'region',name:'地域A（例）',x:40,y:60,w:380,h:440},{id:'r2',kind:'region',name:'地域B（例）',x:480,y:60,w:380,h:440},{id:'h1',kind:'hero',name:'ヒーローA',x:210,y:220},{id:'h2',kind:'hero',name:'ヒーローB',x:650,y:220},{id:'n1',kind:'npc',name:'NPC A',x:210,y:370}],edges:[{id:'e1',a:'h1',b:'h2',name:'関係（例）'}]}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function node(id){return data.nodes.find(n=>n.id===id)}
function draw(){let html='';for(const n of data.nodes.filter(n=>n.kind==='region'))html+=`<g data-node="${n.id}" class="node ${selected===n.id?'selected':''}"><rect class="region" x="${n.x}" y="${n.y}" width="${n.w||320}" height="${n.h||300}" rx="14"/><text x="${n.x+14}" y="${n.y+27}" font-weight="bold">${esc(n.name)}</text></g>`;
for(const e of data.edges){const a=node(e.a),b=node(e.b);if(!a||!b)continue;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;html+=`<g data-edge="${e.id}" class="${selected===e.id?'selected':''}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#252c38" stroke-width="2"/><line class="edge-hit" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text class="rel" x="${mx}" y="${my-10}" text-anchor="middle">${esc(e.name)}</text></g>`}
for(const n of data.nodes.filter(n=>n.kind!=='region')){const cls=`node ${selected===n.id?'selected':''}`;if(n.kind==='org')html+=`<g data-node="${n.id}" class="${cls}"><rect x="${n.x-69}" y="${n.y-27}" width="138" height="54" rx="4" fill="#f0f2f7" stroke="#222" stroke-width="2"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="15">${esc(n.name)}</text></g>`;else html+=`<g data-node="${n.id}" class="${cls}"><circle cx="${n.x}" cy="${n.y}" r="52" fill="${n.kind==='npc'?'#fff':'#e1eafa'}" stroke="#222" stroke-width="2.5" ${n.kind==='npc'?'stroke-dasharray="6 5"':''}/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="15">${esc(n.name)}</text></g>`}drawing.innerHTML=html;sync()}
function sync(){let item=data.nodes.find(n=>n.id===selected)||data.edges.find(e=>e.id===selected);document.getElementById('name').value=item?.name||'';document.getElementById('kind').disabled=!item||!('kind' in item);if(item?.kind)document.getElementById('kind').value=item.kind;document.getElementById('status').textContent=mode==='connect'?(from?'接続先をタップ':'線の始点をタップ'):item?`選択中：${item.name}`:'図形や線をタップして選択できます'}
function point(evt){let p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}svg.addEventListener('pointerdown',e=>{const target=e.target.closest('[data-node],[data-edge]');if(!target)return;const id=target.dataset.node||target.dataset.edge;if(mode==='connect'&&target.dataset.node){if(!from){from=id;selected=id}else if(from!==id){data.edges.push({id:uid(),a:from,b:id,name:'関係未入力'});from=null;selected=data.edges.at(-1).id;mode='move';setModeButtons()}draw();return}selected=id;if(target.dataset.node&&mode==='move'){const n=node(id),p=point(e);drag={id,dx:p.x-n.x,dy:p.y-n.y};svg.setPointerCapture(e.pointerId)}draw()});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),n=node(drag.id);if(n){n.x=Math.round(p.x-drag.dx);n.y=Math.round(p.y-drag.dy);draw()}});function stop(){drag=null}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
function setModeButtons(){for(const m of ['move','connect'])document.getElementById(m).classList.toggle('active',mode===m)}for(const m of ['move','connect'])document.getElementById(m).onclick=()=>{mode=m;from=null;setModeButtons();sync()};function add(kind){const n={id:uid(),kind,name:kind==='hero'?'新規ヒーロー':kind==='npc'?'新規NPC':kind==='org'?'新規組織':'新規地域',x:450,y:310};if(kind==='region'){n.x=250;n.y=120;n.w=400;n.h=360}data.nodes.push(n);selected=n.id;draw()};for(const [id,k] of [['addHero','hero'],['addNpc','npc'],['addOrg','org'],['addRegion','region']])document.getElementById(id).onclick=()=>add(k);document.getElementById('del').onclick=()=>{if(!selected)return;data.nodes=data.nodes.filter(n=>n.id!==selected);data.edges=data.edges.filter(e=>e.id!==selected&&e.a!==selected&&e.b!==selected);selected=null;draw()};document.getElementById('name').oninput=e=>{let item=data.nodes.find(n=>n.id===selected)||data.edges.find(e=>e.id===selected);if(item){item.name=e.target.value;draw()}};document.getElementById('kind').onchange=e=>{let n=node(selected);if(n){n.kind=e.target.value;if(n.kind==='region'){n.w??=360;n.h??=300}draw()}};
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}document.getElementById('save').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'MLBB_相関図編集データ.json');document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('形式が違います');data=d;selected=null;draw()}catch(err){alert('読み込み失敗: '+err.message)}e.target.value=''};document.getElementById('reset').onclick=()=>{if(confirm('現在の編集内容を破棄してサンプルに戻しますか？')){data=sample();selected=null;draw()}};document.getElementById('png').onclick=()=>{const copy=svg.cloneNode(true);copy.setAttribute('width','1800');copy.setAttribute('height','1300');copy.setAttribute('xmlns','http://www.w3.org/2000/svg');const str=new XMLSerializer().serializeToString(copy);const img=new Image(),url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=1800;c.height=1300;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'MLBB_相関図.png')},'image/png');URL.revokeObjectURL(url)};img.onerror=()=>alert('PNG変換に失敗しました');img.src=url};data=sample();draw();
</script></body></html>
